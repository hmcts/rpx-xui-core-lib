<div [formGroup]="group"
class="govuk-form-group" [ngClass]="{'govuk-form-group--error': errorMessage?.isInvalid}">
<xuilib-gov-label [config]="config"></xuilib-gov-label>
<span *ngIf="config.hint" [id]="config.id + '-hint'" class="govuk-hint">
  {{config.hint | rpxTranslate}}
</span>
<xuilib-gov-uk-error-message [config]="config" [errorMessage]="errorMessage"></xuilib-gov-uk-error-message>
<textarea [attr.aria-invalid]="errorMessage?.isInvalid ? 'true' : null"
  class="govuk-textarea" [formControlName]="config.key"
  [ngClass]="{'govuk-textarea--error': errorMessage?.isInvalid}"
  [id]="config.id" name="more-detail" [rows]="config.rows" [attr.aria-describedby]="setDescribedBy()"></textarea>
</div>
