<input id="add-user-control" class="govuk-input" type="text" [matAutocomplete]="dropdown" [formControl]="control"
  aria-describedby="add-user-hint">

<mat-autocomplete #dropdown="matAutocomplete" [displayWith]="displayValue" autoActiveFirstOption (optionSelected)="onSelected($event)">
  @for (user of filteredUsers | async; track user) {
    <mat-option [value]="user">
      {{ user.firstName | rpxTranslate }} {{ user.lastName | rpxTranslate }} - {{ user.email }}
    </mat-option>
  }
</mat-autocomplete>
