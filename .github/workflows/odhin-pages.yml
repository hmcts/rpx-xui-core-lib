name: Publish Odhín reports

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: core-lib-odhin-publication
  cancel-in-progress: false

jobs:
  publish:
    # PR code runs only in read-only CI; publishing consumes default-branch runs.
    if: >-
      ${{ github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Locate this run's report artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.name == "core-lib-odhin" and .expired == false) | .id')
          if [ -n "$artifact_id" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            printf 'No browser Odhín artifact was generated. [Open source run](%s/actions/runs/%s).\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download report from the exact source run
        if: steps.artifact.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-lib-odhin
          path: odhin-source
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Archive report with branch and run navigation
        if: steps.artifact.outputs.available == 'true'
        id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          node tests/reporters/odhin-site-publisher.cjs --check-source odhin-source
          report_repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          if git -c http.extraheader="$auth_header" ls-remote --exit-code --heads "$report_repo_url" odhin-reports >/dev/null 2>&1; then
            git -c http.extraheader="$auth_header" clone --branch odhin-reports --single-branch "$report_repo_url" odhin-site
          else
            git init -b odhin-reports odhin-site
            git -C odhin-site remote add origin "$report_repo_url"
          fi
          node tests/reporters/odhin-site-publisher.cjs \
            --source odhin-source --site odhin-site --branch "$SOURCE_BRANCH" \
            --run-key "$SOURCE_RUN-attempt-$SOURCE_ATTEMPT" --run-id "$SOURCE_RUN" \
            --run-attempt "$SOURCE_ATTEMPT" --sha "$SOURCE_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT" > report-paths.json
          node -e 'const p = require("./report-paths.json"); console.log(`branch_path=${p.branchUrlPath}\nrun_path=${p.runUrlPath}`)' >> "$GITHUB_OUTPUT"
          git -C odhin-site config user.name github-actions[bot]
          git -C odhin-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C odhin-site add .nojekyll index.html reports
          if ! git -C odhin-site diff --cached --quiet; then
            git -C odhin-site commit -m "ci: publish Odhín run $SOURCE_RUN attempt $SOURCE_ATTEMPT"
            git -c http.extraheader="$auth_header" -C odhin-site push origin HEAD:odhin-reports
          fi
      - name: Configure existing GitHub Pages
        if: steps.artifact.outputs.available == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload report site
        if: steps.artifact.outputs.available == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: odhin-site
      - name: Deploy report site
        if: steps.artifact.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Link published reports
        if: steps.artifact.outputs.available == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BRANCH_PATH: ${{ steps.report.outputs.branch_path }}
          RUN_PATH: ${{ steps.report.outputs.run_path }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          printf '[Report index](%s) · [Branch history](%s%s) · [This run](%s%s)\n\n' "$PAGE_URL" "$PAGE_URL" "$BRANCH_PATH" "$PAGE_URL" "$RUN_PATH" >> "$GITHUB_STEP_SUMMARY"
          printf '[Source run and downloadable evidence](%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
