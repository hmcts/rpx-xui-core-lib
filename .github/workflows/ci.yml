name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install with the checked-in Yarn release
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Install Chromium
        run: node .yarn/releases/yarn-4.18.1.cjs playwright install --with-deps chromium
      - name: Build and verify required contracts
        run: node .yarn/releases/yarn-4.18.1.cjs test:all
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-foundation-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
